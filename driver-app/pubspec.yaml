name: driver_app
description: "Ambulance Driver Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_local_notifications: ^17.2.4

  flutter_sms: ^3.0.1
  connectivity_plus: ^6.0.3

  # Firebase Core
  firebase_core: ^3.15.2

  # Firestore (SOS requests + patient data)
  cloud_firestore: ^5.0.0

  # Firebase Authentication (optional if login exists)
  firebase_auth: ^5.0.0

  # Push notifications
  firebase_messaging: ^15.2.10

  # Google Maps for driver navigation
  google_maps_flutter: ^2.6.1

  # GPS location tracking
  geolocator: ^11.1.0

  # API calls (if needed later)
  http: ^1.2.1

  # State management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true